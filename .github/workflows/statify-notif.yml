name: Statify notifications
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: statify-notif
  cancel-in-progress: false
jobs:
  notif:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - id: run
        run: node notify.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Garder la memoire des alertes deja envoyees
        if: always()
        run: |
          git config user.name statify-bot
          git config user.email bot@users.noreply.github.com
          # petit battement hebdomadaire : GitHub coupe les workflows planifiés après 60 jours sans activité
          if [ "$(date +%u)" = "1" ] && [ "$(date +%H)" = "06" ]; then date -u +%F > .keepalive; git add .keepalive; fi
          git add state.json
          git diff --cached --quiet || (git commit -m "etat" && git pull --rebase -q && git push)
      - name: Relancer si un match est encore en cours
        if: steps.run.outputs.again == 'true'
        run: gh workflow run statify-notif.yml
        env:
          GH_TOKEN: ${{ github.token }}
